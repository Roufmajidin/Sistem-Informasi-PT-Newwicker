<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewWicker QC Monitor</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="brand">
      <div class="brand-icon">QC</div>
      <div>
        <div class="eyebrow">NEWWICKER</div>
        <h1>QC Monitor</h1>
        <p>Ambil laporan QC dari Laravel ke Excel.</p>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Filter Data</div>

      <label for="inspector">Inspector</label>
      <select id="inspector">
        <option value="">Semua Inspector</option>
      </select>

      <div class="date-grid">
        <div>
          <label for="dateFrom">From</label>
          <input id="dateFrom" type="date">
        </div>
        <div>
          <label for="dateTo">To</label>
          <input id="dateTo" type="date">
        </div>
      </div>

      <div class="actions">
        <button id="loadBtn" class="btn btn-primary">Load QC Data</button>
        <button id="clearBtn" class="btn btn-secondary">Clear</button>
      </div>

      <div id="status" class="status neutral">Ready.</div>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <div class="section-title">Worksheet</div>
          <div id="worksheetName" class="muted">-</div>
        </div>
        <div id="rowCount" class="badge">0 rows</div>
      </div>

      <button id="createSheetBtn" class="btn btn-outline">Create / Select QC Report Sheet</button>
      <p class="hint">
        Data akan ditulis mulai dari cell A1 pada sheet <strong>QC Report</strong>.
      </p>
    </section>

    <footer>
      <span>Laravel API</span>
      <span id="apiLabel">/api/qc/laporan/add-in</span>
    </footer>
  </main>
</body>
</html>
